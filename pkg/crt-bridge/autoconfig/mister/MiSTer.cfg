# Autoconfig profile for the "mister" RetroArch joypad driver
# (input/drivers_joypad/mister_joypad.c). RetroArch scans autoconfig
# profiles per driver, under <autoconfig_dir>/<joypad_driver>/*.cfg
# (tasks/task_autodetect.c, input_autoconfigure_scan_config_files_external)
# -- this file belongs at <autoconfig_dir>/mister/MiSTer.cfg.
#
# Without this file, config.def.h's built-in keybinds provide no joykey at
# all (NO_BTN everywhere): mister_joypad_state() never finds a joykey that
# is not NO_BTN, and reports "nothing pressed" no matter what the receiver
# sends on the wire.
#
# mister_pad_get_button() (mister_joypad.c) does no raw-index-to-semantic
# translation: it expects joykey to already carry the value of the
# RETRO_DEVICE_ID_JOYPAD_* button constant (libretro.h). The values below
# are therefore an explicit IDENTITY (joykey == RETRO_DEVICE_ID_JOYPAD_*),
# not a physical controller mapping -- except Y/X, see the note below.
#
# Y and X are SWAPPED. The wire (receiver-side button bits) and the driver
# (mister_joypad.c, JOYPAD_Y -> GM_JOY_B3 = west, JOYPAD_X -> GM_JOY_B4 =
# north) both follow libretro.h's SNES-style convention (Y = west button,
# X = north button). SwanStation, empirically, displays Y as Triangle and
# X as Square -- the opposite of that generic convention. Rather than
# realign the wire or the driver (both correct, and followed by other
# consumers), the two values below are swapped: Y receives X's identity
# and vice versa, so the west bit (Square) feeds the slot SwanStation
# displays as Square, and the north bit (Triangle) feeds the slot it
# displays as Triangle.
input_driver     = "mister"
input_device     = "MiSTer"
input_vendor_id  = "39321"
input_product_id = "39321"

input_b_btn      = "0"
input_y_btn      = "9"
input_select_btn = "2"
input_start_btn  = "3"
input_up_btn     = "4"
input_down_btn   = "5"
input_left_btn   = "6"
input_right_btn  = "7"
input_a_btn      = "8"
input_x_btn      = "1"
input_l_btn      = "10"
input_r_btn      = "11"
input_l2_btn     = "12"
input_r2_btn     = "13"

# Axes 0..3 as mister_joypad_poll fills them: joy1_lx, ly, rx, ry
# (mister_joypad.c) -- +N/-N is an axis index, not a physical value
# (AXIS_POS/AXIS_NEG, input_defines.h). Y negative is up (libretro
# convention); the receiver's scaling already produces that sign for an
# evdev stick, so "-1" is indeed the "up" half. Useless without the
# driver's sign filter (mister_joypad_axis_state) -- both are required
# together.
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
