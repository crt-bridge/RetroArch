# crt-bridge emitter configuration template. The receiver target is empty on
# purpose: set video_record_config to your receiver's address and port, e.g.
# 192.0.2.20:32100 (a documentation address; use your own).

# --- Recording: the bridge ships each frame out over the network ---
record_driver = "groovy"
video_record_config = ""
record_path = ""
record_use_output_dir = "false"

# --- Video: threaded video and RetroArch's own vsync fight the bridge's frame pacing ---
video_driver = "vulkan"
video_threaded = "false"
video_vsync = "false"
video_swap_interval = "1"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_fullscreen = "false"
video_windowed_fullscreen = "false"

# --- Audio: xaudio avoids the WASAPI exclusive-mode stalls seen on fast-forward ---
audio_driver = "xaudio"
audio_enable = "true"
audio_sync = "true"
audio_rate_control_delta = "0.000000"
audio_max_timing_skew = "0.05"
audio_output_rate = "48000"

# --- Input: the "mister" driver wraps the platform driver so shortcuts keep working ---
input_driver = "mister"
input_joypad_driver = "mister"
input_menu_toggle_gamepad_combo = "1"
joypad_autoconfig_dir = ":\autoconfig"

# --- Menu: RGUI is the only driver light enough to read on a 15 kHz CRT ---
menu_driver = "rgui"

# --- Misc: nothing competes with the bridge for CPU or writes logs to disk ---
cheevos_enable = "false"
netplay_enable = "false"
pause_nonactive = "false"
config_save_on_exit = "true"
log_verbosity = "false"
libretro_directory = ":\cores"

# --- Bridge settings: also editable in-game, under Settings > Recording ---
groovy_bridge_enable = "true"
groovy_compression = "true"
groovy_input = "true"
groovy_audio = "1"
groovy_mtu = "1472"
groovy_followers = ""
