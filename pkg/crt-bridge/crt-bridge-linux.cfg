# crt-bridge emitter configuration template. The receiver target is empty on
# purpose: set video_record_config to your receiver's address and port, e.g.
# 192.0.2.20:32100 (a documentation address; use your own).

# --- Recording: the bridge ships each frame out over the network ---
record_driver = "groovy"
video_record_config = ""
record_path = ""
record_use_output_dir = "false"

# --- Video: threaded video fights the bridge's frame pacing ---
video_driver = "sdl2"
video_threaded = "false"
video_vsync = "true"
video_swap_interval = "1"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_fullscreen = "false"
video_windowed_fullscreen = "false"

# --- Audio: alsa is the only Linux path measured against the bridge so far ---
audio_driver = "alsa"
audio_enable = "true"
audio_sync = "true"
audio_rate_control = "true"
audio_rate_control_delta = "0.000000"

# --- Input: sdl2 drives keyboard/mouse here -- the "mister" input wrapper is
# Windows-only (mister_input.o is not built under HAVE_GROOVY on this
# platform); the joypad half of that driver still is, and stays selected. ---
input_driver = "sdl2"
input_joypad_driver = "mister"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "1"

# --- Menu: RGUI is the only driver light enough to read on a 15 kHz CRT ---
menu_driver = "rgui"

# --- Misc: nothing competes with the bridge for CPU or writes logs to disk;
# config_save_on_exit means the menu's bridge settings are saved back into
# this file, inside the kit ---
cheevos_enable = "false"
netplay_enable = "false"
pause_nonactive = "false"
config_save_on_exit = "true"
log_verbosity = "false"

# --- Folders: everything RetroArch writes stays inside this kit ---
libretro_directory = ":/cores"
libretro_info_path = ":/info"
joypad_autoconfig_dir = ":/autoconfig"
system_directory = ":/system"
savefile_directory = ":/saves"
savestate_directory = ":/states"
screenshot_directory = ":/screenshots"
playlist_directory = ":/playlists"
content_favorites_directory = ":/playlists"
content_history_directory = ":/playlists"
content_image_history_directory = ":/playlists"
content_music_history_directory = ":/playlists"
content_video_directory = ":/playlists"
cache_directory = ":/cache"
log_dir = ":/logs"
runtime_log_directory = ":/logs/runtime"
rgui_config_directory = ":/config"
input_remapping_directory = ":/config/remaps"
recording_output_directory = ":/recordings"
recording_config_directory = ":/config/record"
core_assets_directory = ":/downloads"
assets_directory = ":/assets"
dynamic_wallpapers_directory = ":/assets/wallpapers"
thumbnails_directory = ":/thumbnails"
video_shader_dir = ":/shaders"
video_filter_dir = ":/filters/video"
audio_filter_dir = ":/filters/audio"
overlay_directory = ":/overlays"
osk_overlay_directory = ":/overlays/keyboards"
cheat_database_path = ":/cheats"
content_database_path = ":/database/rdb"

# --- Bridge settings: also editable in-game, under Settings > Recording ---
groovy_bridge_enable = "true"
groovy_compression = "true"
groovy_input = "true"
groovy_audio = "1"
groovy_mtu = "1472"
groovy_followers = ""
# groovy_pad: "true" only towards a crt-bridge client or receiver, never a MiSTer (Wi-Fi: see README)
groovy_pad = "false"
