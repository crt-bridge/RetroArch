name: crt-bridge emitter release

# Triggered by a version tag Sir pushes on crt-bridge (job `meta` validates
# it), or manually for a build-only smoke test. `workflow_dispatch` never
# creates a release -- see job `publish`.
on:
  push:
    tags:
      - "v*-crtbridge.*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp, e.g. v1.22.2-crtbridge.1. A manual run only
          uploads build artifacts, it never creates a release.
        required: true

permissions:
  contents: read

concurrency:
  group: crt-bridge-release-${{ github.ref }}
  cancel-in-progress: false

# The version is only ever read via $VERSION inside scripts, never
# interpolated into a run: block -- see the `meta` job's validation step.
env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  meta:
    name: Validate tag and read pinned commits
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
      libgm_commit: ${{ steps.check.outputs.libgm_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate version, ancestry, and the libgm pin
        id: check
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-crtbridge\.[1-9][0-9]*$ ]]; then
            echo "::error::VERSION '$VERSION' does not match v<major>.<minor>.<patch>-crtbridge.<N>"
            exit 1
          fi

          base=$(sed -n 's/^#define PACKAGE_VERSION "\(.*\)"$/\1/p' version.all)
          if [ -z "$base" ]; then
            echo "::error::could not read PACKAGE_VERSION from version.all"
            exit 1
          fi
          tag_base="${VERSION#v}"
          tag_base="${tag_base%-crtbridge.*}"
          if [ "$tag_base" != "$base" ]; then
            echo "::error::tag base '$tag_base' does not match version.all's PACKAGE_VERSION '$base'"
            exit 1
          fi

          git fetch --no-tags origin crt-bridge
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of origin/crt-bridge"
            exit 1
          fi

          libgm_commit=$(git ls-tree HEAD libgm | awk '$2=="commit"{print $3}')
          if [ -z "$libgm_commit" ]; then
            echo "::error::libgm is not a pinned commit (gitlink) at HEAD"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "libgm_commit=$libgm_commit" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows x64
    needs: meta
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python

      - name: Stamp version
        run: |
          set -euo pipefail
          sed -i "s/^#define PACKAGE_VERSION \".*\"$/#define PACKAGE_VERSION \"${VERSION#v}\"/" version.all
          grep -q "PACKAGE_VERSION \"${VERSION#v}\"" version.all

      - name: Build libgm
        run: make -C libgm CC=gcc AR=ar libgm.a libgm.dll

      - name: Configure
        run: |
          set -euo pipefail
          ./configure --disable-cheevos --disable-translate
          grep -q '^HAVE_VULKAN = 1' config.mk

      - name: Build
        run: make -j"$(nproc)" HAVE_GROOVY=1 LIBGM_DIR="$PWD/libgm"

      - name: Check libgm import
        run: |
          # No -q: grep -q exits the moment it sees a match, closing its
          # end of the pipe while objdump may still be writing -- under
          # the shell's default pipefail this becomes a SIGPIPE (exit
          # 141) from objdump, not a real check failure. Redirecting
          # instead keeps grep reading to EOF; the exit status (0 found,
          # 1 not found) is unchanged.
          objdump -p retroarch.exe | grep 'DLL Name: libgm.dll' >/dev/null

      - name: Check bench strings
        # Bench tools (fault injection, frame timer, diagnostic log lines)
        # are built only with an opt-in make flag this workflow never sets.
        # The list of their strings lives in package-release.py; one of
        # them found in the executable or in libgm.dll fails the build.
        run: python pkg/crt-bridge/package-release.py check-bench-strings --binary retroarch.exe --dll libgm/libgm.dll

      - name: Check license notice
        # The build itself proves the notice lists what it compiled: print
        # the features configure switched on, then compare the third-party
        # object folders of this build with the component table of
        # package-release.py (the table NOTICE.txt and LICENSES/ come from).
        run: |
          set -euo pipefail
          grep -E '^HAVE_[A-Z0-9_]+ = 1' config.mk | sort
          python pkg/crt-bridge/package-release.py check-notice-objects --obj-dir obj-unix/release --platform windows

      - name: Package
        run: |
          set -euo pipefail
          MINGW_BIN="$(cygpath -m /mingw64/bin)"
          MSYS_ROOT="$(cygpath -m /)"
          python pkg/crt-bridge/package-release.py stage \
            --platform windows --fork-dir . --libgm-dir libgm \
            --binary retroarch.exe --version "$VERSION" \
            --fork-commit "$GITHUB_SHA" \
            --libgm-commit "${{ needs.meta.outputs.libgm_commit }}" \
            --out dist --mingw-bin "$MINGW_BIN" --msys-root "$MSYS_ROOT"
          python pkg/crt-bridge/package-release.py check \
            --platform windows --dir "dist/crt-bridge-emitter-$VERSION-windows-x64" \
            --mingw-bin "$MINGW_BIN" --require-branding --forbid-bench-strings
          python pkg/crt-bridge/package-release.py archive \
            --platform windows --dir "dist/crt-bridge-emitter-$VERSION-windows-x64" \
            --out "dist/crt-bridge-emitter-$VERSION-windows-x64.zip"
          python pkg/crt-bridge/package-release.py check \
            --platform windows --archive "dist/crt-bridge-emitter-$VERSION-windows-x64.zip" \
            --mingw-bin "$MINGW_BIN" --require-branding --forbid-bench-strings

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Build Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: without git in the container, actions/checkout
      # cannot fetch the libgm submodule.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates python3 \
            libsdl2-dev libasound2-dev libudev-dev libx11-xcb-dev libvulkan-dev

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
          persist-credentials: false

      - name: Stamp version
        run: |
          set -euo pipefail
          sed -i "s/^#define PACKAGE_VERSION \".*\"$/#define PACKAGE_VERSION \"${VERSION#v}\"/" version.all
          grep -q "PACKAGE_VERSION \"${VERSION#v}\"" version.all

      - name: Build libgm
        run: make -C libgm libgm.a

      - name: Configure
        run: |
          set -euo pipefail
          ./configure --disable-cheevos --disable-translate
          grep -q '^HAVE_VULKAN = 1' config.mk
          grep -q '^HAVE_SDL2 = 1' config.mk

      - name: Build
        run: make -j"$(nproc)" HAVE_GROOVY=1 LIBGM_DIR="$PWD/libgm"

      - name: Check libgm link
        # No -q, same reason as the Windows "Check libgm import" step:
        # grep -q closes the pipe on first match, and nm writing into a
        # closed pipe under pipefail turns into a SIGPIPE (exit 141)
        # instead of the intended pass/fail signal.
        run: nm retroarch | grep -w gm_init >/dev/null

      - name: Check bench strings
        # Same check as the Windows job: bench tools are built only with an
        # opt-in make flag this workflow never sets, and the list of their
        # strings lives in package-release.py. libgm is linked statically
        # here, so the executable is the only file to read.
        run: python3 pkg/crt-bridge/package-release.py check-bench-strings --binary retroarch

      - name: Check license notice
        # Same check as the Windows job: the build itself proves the notice
        # lists what it compiled.
        run: |
          set -euo pipefail
          grep -E '^HAVE_[A-Z0-9_]+ = 1' config.mk | sort
          python3 pkg/crt-bridge/package-release.py check-notice-objects --obj-dir obj-unix/release --platform linux

      - name: Package
        run: |
          set -euo pipefail
          python3 pkg/crt-bridge/package-release.py stage \
            --platform linux --fork-dir . --libgm-dir libgm \
            --binary retroarch --version "$VERSION" \
            --fork-commit "$GITHUB_SHA" \
            --libgm-commit "${{ needs.meta.outputs.libgm_commit }}" \
            --out dist
          python3 pkg/crt-bridge/package-release.py check \
            --platform linux --dir "dist/crt-bridge-emitter-$VERSION-linux-x64" \
            --require-branding --forbid-bench-strings
          python3 pkg/crt-bridge/package-release.py archive \
            --platform linux --dir "dist/crt-bridge-emitter-$VERSION-linux-x64" \
            --out "dist/crt-bridge-emitter-$VERSION-linux-x64.tar.gz"
          python3 pkg/crt-bridge/package-release.py check \
            --platform linux --archive "dist/crt-bridge-emitter-$VERSION-linux-x64.tar.gz" \
            --require-branding --forbid-bench-strings

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [meta, windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        # The heredoc delimiter is quoted on purpose: bash then expands
        # nothing inside the text, so a backtick or a dollar sign written in
        # the notes (a command name, a PowerShell example) stays text instead
        # of running as a command in this job. The two values the text needs
        # arrive as @TOKENS@ replaced by sed below; the ${{ }} expressions are
        # replaced by Actions before bash starts, from the validated outputs
        # of the `meta` job.
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          # crt-bridge emitter @VERSION@

          Based on RetroArch ${{ needs.meta.outputs.base }}. Not affiliated with, or endorsed by, the libretro project.

          Pre-release: awaiting feedback from outside the test bench.

          libgm source for this build: https://github.com/crt-bridge/libgm/tree/${{ needs.meta.outputs.libgm_commit }}

          Fork source: https://github.com/crt-bridge/RetroArch/tree/@FORK_COMMIT@

          No libretro core is included.

          Software receiver (a libretro core for a second computer) -- over Wi-Fi, turn on Padded Session: https://github.com/crt-bridge/libretro-crt-bridge

          Windows binaries are not code-signed (details below).

          Before you plug in a tube, read the section "Before you connect a CRT" at the top of README.md inside the archive. crt-bridge protects no monitor.

          ## What's new in this release

          Changes since the previous pre-release, v1.22.2-crtbridge.3.

          - 480p to the receiver. With Settings > Recording > Receiver 31 kHz turned on, a picture taller than 280 lines is sent as progressive 480p instead of interlaced 480i. It is Off by default: turn it on only if the master receiver's tube takes 31 kHz, and never towards a MiSTer.
          - Supersampling reduction you can set. A core that renders at a multiple of its native size is reduced before the picture is sent. Settings > Recording > Supersampling reduction is Auto by default; 2x, 4x, 8x and Off are the other choices. A line on the PC screen says what was done, for example: `Supersampling reduction: Auto -> 2x (1280x864 -> 640x432), GPU, vulkan`
          - The reduction runs on the graphics card under the `glcore` (OpenGL) and `vulkan` video drivers, instead of on the processor.
          - No default receiver address. Until you set one, nothing is sent; when you load a game the emitter says so on the PC screen and tells where to set it: Settings > Recording > Groovy Master Address.

          ## Known limitations

          - Under the `d3d11` video driver the reduction runs on the processor, and with the LRPS2 (PlayStation 2) core the picture sent to the receiver is black. Use `vulkan` or `glcore`.
          - The `d3d12` video driver has never been checked with any core.
          - A picture in a 10-bit format (seen once, with the Dolphin core under `vulkan`) may be read as 8-bit and show wrong colours.
          - PAL (576 lines) is refused: nothing is sent, and the PC screen says so.
          - The Dreamcast and PlayStation 2 cores skip frames: a few per minute with the Dreamcast core, tens per minute with the PlayStation 2 core in 480p. The Dreamcast picture looked smooth in testing.
          - The picture reaches the tube about one frame after the emulator renders it, and up to about two frames in the worst case.
          - The crt-bridge client on a Mac, as an extra receiver over Wi-Fi, froze once (picture and sound) during a 480p session while the CRT carried on. Seen once, cause not found.
          - Auto reduces a Nintendo 64 picture rendered at 4x (GLideN64) by 2, to 480 lines. Choose 4x in Settings > Recording > Supersampling reduction for a 240p picture.
          - The Linux emitter has only been run towards the software receiver, never towards a CRT receiver.
          - A follower that never sends a status back (the crt-bridge client run with GMC_STATUS=0) is never seen as in sync: the emitter sends it the session opening and the video mode again every 10 seconds for as long as it runs, and its gamepad channel is reset each time. This repeat is also how it recovers a lost mode change, within 10 seconds.
          - The crt-bridge client on a Mac over Wi-Fi, run with the default RetroArch settings, can play crackling sound while its picture is right. The receiver on the CRT is not affected. Not yet explained.
          - L3 and R3 (the stick clicks) do not reach the game: the Groovy input protocol carries ten buttons only.
          - Changing the gamepad on the receiver while it runs breaks input until the receiver service is restarted.
          - An Xbox One / Series X|S controller does not finish its USB initialisation on the receiver: its logo keeps blinking and no input arrives.
          - The Y/X swap in the bundled MiSTer.cfg gamepad profile has only been verified with an Xbox 360 controller.

          ## Windows binaries are not code-signed

          Windows may warn you the first time you run the emitter. Two Windows features are involved.

          - SmartScreen can warn about a program it does not know. The usual way through is More info, then Run anyway.
          - Smart App Control, if it is on, asks a Microsoft cloud service about a program first. When that service cannot vouch for an unsigned program, Windows blocks it, and there is no exception for a single application: the choices are to turn Smart App Control off in Windows Security, or not to run the emitter.

          A warning is expected for an unsigned program. It does not mean the download was altered, and it does not replace checking it: compare the SHA-256 of your archive with the lines below. In PowerShell: `Get-FileHash -Algorithm SHA256 <archive>`. On Linux: `sha256sum <archive>`.
          EOF

          sed -i "s|@VERSION@|$VERSION|g; s|@FORK_COMMIT@|$GITHUB_SHA|g" notes.md

          {
            printf '\n## SHA-256\n\n'
            (cd dist && sha256sum --text "crt-bridge-emitter-$VERSION-windows-x64.zip" \
                                       "crt-bridge-emitter-$VERSION-linux-x64.tar.gz") | sed 's/^/    /'
          } >> notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            "dist/crt-bridge-emitter-$VERSION-windows-x64.zip" \
            "dist/crt-bridge-emitter-$VERSION-linux-x64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease \
            --title "crt-bridge emitter $VERSION" \
            --notes-file notes.md
